<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="screen-orientation" content="portrait" />
  <title>Aetheria Online — Isekai Adventure</title>
  <!-- THEME.css (from the UX/UI designer) is injected at runtime by game.js -->
</head>
<body>
  <div id="rotate-hint" class="rotate-hint">
    <div class="rotate-icon">📱↻</div>
    <b>Please rotate device to vertical portrait</b>
  </div>
  <div id="err" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#b00;color:#fff;font:12px monospace;white-space:pre-wrap;padding:4px 8px;display:none"></div>
  <script>
    // surface runtime crashes instead of silently freezing (click the banner to dismiss)
    const errEl = document.getElementById('err');
    errEl.onclick = () => errEl.style.display = 'none';
    window.addEventListener('error', e => { errEl.style.display = 'block'; errEl.textContent += `Something broke: ${e.message} @ ${e.filename || ''}:${e.lineno || ''}\n`; });
    window.addEventListener('unhandledrejection', e => { errEl.style.display = 'block'; errEl.textContent += `Something broke: ${e.reason?.message || e.reason}\n`; });
  </script>
  <div id="root"></div>
  <canvas id="game-canvas" width="832" height="576" style="display:none"></canvas>
  <div id="hud"></div>
  <div id="touch-controls" class="touch-controls" style="display:none">
    <div class="touch-zone"></div>
    <div class="touch-joystick">
      <div class="touch-joystick-base">
        <div class="touch-joystick-knob"></div>
      </div>
    </div>
    <div class="touch-action-buttons">
      <button class="touch-action-btn touch-btn-s1" data-action="s1">S1</button>
      <button class="touch-action-btn touch-btn-s2" data-action="s2">S2</button>
      <button class="touch-action-btn touch-btn-s3" data-action="s3">S3</button>
      <button class="touch-action-btn touch-btn-s4" data-action="s4">S4</button>
      <button class="touch-action-btn touch-btn-s5" data-action="s5">S5</button>
      <button class="touch-action-btn touch-btn-s6" data-action="s6">S6</button>
      <button class="touch-action-btn touch-btn-dodge" data-action="dodge">Dodge</button>
      <button class="touch-action-btn touch-btn-atk" data-action="attack">ATK</button>
    </div>
  </div>
  <div id="overlays"></div>
  <div id="fx-layer"></div>
  <script type="module" src="./js/game.js?v=1.0.5"></script>
</body>
</html>
